services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: educaro
      POSTGRES_PASSWORD: educaro
      POSTGRES_DB: educaro
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Demo inbox: every outgoing mail lands here (web UI on :8025). Never mail real offices from the prototype.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  pgdata:
