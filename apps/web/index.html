<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Educaro: tell your story once. An agent builds your profile, checks it against real requirements and stays with you all the way to Germany." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Educaro</title>
    <script>
      // Apply the theme before first paint to avoid a flash.
      (function () {
        try {
          var pref = localStorage.getItem('educaro.theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
